name: Update Contribution Spectrum

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate spectrum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: anikaexe
        run: python .github/workflows/.github/scripts/generate_spectrum.py

      - name: Commit updated visualization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assests/contribution-spectrum.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update contribution spectrum"
            git push
          fi
